<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ganti Password — Market Watch AJN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f4f8;display:flex;align-items:center;justify-content:center;min-height:100vh;color:#1e293b}
.card{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:380px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.card h2{font-size:1rem;font-weight:800;color:#1B3A6B;margin-bottom:16px;text-align:center}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:.72rem;font-weight:600;color:#475569;margin-bottom:4px}
.form-input{width:100%;padding:9px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:.82rem;outline:none;font-family:inherit}
.form-input:focus{border-color:#C9A84C}
.btn{display:block;width:100%;padding:10px;background:#C9A84C;color:#fff;border:none;border-radius:8px;font-size:.82rem;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit}
.btn:hover{background:#b8943e}
.alert{padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:.74rem}
.alert-danger{background:#FEE2E2;color:#991B1B;border:1px solid #FECACA}
</style>
</head>
<body>
<div class="card">
  <h2>Ganti Password</h2>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}{% for cat,msg in messages %}<div class="alert alert-{{ cat }}">{{ msg }}</div>{% endfor %}{% endif %}
  {% endwith %}
  <form method="POST">
    <div class="form-group"><label class="form-label">Password Lama</label><input type="password" name="old_password" class="form-input" required></div>
    <div class="form-group"><label class="form-label">Password Baru</label><input type="password" name="new_password" class="form-input" minlength="6" required></div>
    <div class="form-group"><label class="form-label">Konfirmasi</label><input type="password" name="confirm_password" class="form-input" minlength="6" required></div>
    <button type="submit" class="btn">Simpan Password</button>
  </form>
</div>
</body>
</html>
