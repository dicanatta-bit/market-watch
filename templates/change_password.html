{% extends "base.html" %}
{% block title %}Ganti Password — Market Watch AJN{% endblock %}
{% block content %}
<div style="max-width:400px;margin:60px auto;">
  <div class="card">
    <div class="card-title">Ganti Password</div>
    <form method="POST">
      <div class="form-group">
        <label class="form-label" for="old_password">Password Lama</label>
        <input type="password" name="old_password" id="old_password" class="form-input" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="new_password">Password Baru</label>
        <input type="password" name="new_password" id="new_password" class="form-input" minlength="6" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm_password">Konfirmasi Password Baru</label>
        <input type="password" name="confirm_password" id="confirm_password" class="form-input" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-gold" style="width:100%">Simpan Password</button>
    </form>
  </div>
</div>
{% endblock %}
