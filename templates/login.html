{% extends "base.html" %}
{% block title %}Login — Market Watch AJN{% endblock %}
{% block content %}
<div style="max-width:400px;margin:80px auto;">
  <div class="card">
    <div class="card-title" style="text-align:center;font-size:1.1rem;">Login Market Watch</div>
    <form method="POST">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" name="username" id="username" class="form-input" placeholder="username@ajn.id atau knmp_xxx" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" name="password" id="password" class="form-input" placeholder="Password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Login</button>
    </form>
  </div>
</div>
{% endblock %}
