name: Market Watch AJN - Auto Update

on:
  schedule:
    # Setiap Senin jam 01:00 UTC = 08:00 WIB
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write   # Dibutuhkan untuk push laporan & HTML ke repo

jobs:

  # ── Job 1: Scrape TPI SIHI dari runner lokal (butuh akses IP Indonesia) ───
  scrape_tpi:
    name: Scrape TPI SIHI (self-hosted)
    runs-on: [self-hosted, Windows, X64]
    continue-on-error: true
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape TPI SIHI (ambil harga ikan aktual)
        env:
          SIHI_TIMEOUT: 30
        run: python scrape_sihi.py

      - name: Match TPI ke KNMP
        run: python match_tpi_knmp.py --skip-scrape

      - name: Commit data TPI
        shell: bash
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions [Market Watch AJN]"
          git add data/tpi_harga.csv data/knmp_tpi_match.csv
          git diff --cached --quiet || git commit -m "data: update harga TPI $(date +%Y-%m-%d)"
          git pull --rebase || true
          git push || true

  # ── Job 2: Update sheet, infografis, laporan (ubuntu-latest) ─────────────
  update:
    name: Update Sheet & Deploy
    runs-on: ubuntu-latest
    needs: [scrape_tpi]
    if: always()
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tulis credentials.json dari secret
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Backfill historis (skip jika sheet sudah ada)
        run: python backfill_historis.py --skip-if-exists || true

      - name: Jalankan auto update
        run: python auto_update.py

      - name: Format sheet Harga Komoditas (Senin)
        run: python sheet_formatter.py

      - name: Generate harga wilayah
        continue-on-error: true
        run: python generate_harga_wilayah.py

      - name: Hapus credentials (cleanup)
        if: always()
        run: rm -f credentials.json

      - name: Commit laporan, infografis & GitHub Pages
        if: success()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions [Market Watch AJN]"
          git add output/ data/ index.html knmp.html || true
          git diff --cached --quiet || git commit -m "auto: laporan, infografis & peta $(date +%Y-%m-%d)"
          git pull --rebase || true
          git push || true
